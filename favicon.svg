<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E5A60" />
      <stop offset="100%" stop-color="#2A9D8F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2B705" />
      <stop offset="100%" stop-color="#F2C94C" />
    </linearGradient>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  
  <!-- Steam lines rising from the cup -->
  <path d="M46 36 C42 27 50 20 46 13" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  <path d="M64 34 C60 23 70 17 65 9" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round" />
  <path d="M82 36 C78 27 86 20 82 13" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- Cup body -->
