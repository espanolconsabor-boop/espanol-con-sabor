  <!-- Accent heart / coffee bean icon on cup -->
  <circle cx="64" cy="65" r="7.5" fill="url(#goldGrad)" />
  
  <!-- Saucer plate -->
  <path d="M20 96 C20 96 35 104 64 104 C93 104 108 96 108 96 C110 95 107 92 105 92 L23 92 C21 92 18 95 20 96 Z" fill="url(#goldGrad)" />
